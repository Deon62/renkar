<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Bookings | Renkar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="history-page">
        <header class="history-header">
            <h1>Past Activity</h1>
            <p>Your recent rentals and hired drivers in one place.</p>
        </header>

        <section class="history-tabs" role="tablist" aria-label="Booking history type">
            <button class="history-tab active" data-mode="cars" role="tab" aria-selected="true">Cars</button>
            <button class="history-tab" data-mode="drivers" role="tab" aria-selected="false">Drivers</button>
        </section>

        <section class="history-content">
            <div class="history-empty" id="historyEmpty" hidden>
                <i class="fas fa-inbox"></i>
                <h2>No records yet</h2>
                <p>Once you complete bookings, they’ll show up here.</p>
            </div>

            <div class="history-list" id="historyList"></div>
        </section>
    </main>

    <!-- More Options Modal -->
    <div class="more-modal" id="historyMoreModal" aria-hidden="true">
        <div class="more-modal-overlay" id="historyMoreOverlay"></div>
        <div class="more-modal-content" role="dialog" aria-modal="true" aria-labelledby="historyMoreTitle">
            <div class="more-modal-header">
                <h2 id="historyMoreTitle">More</h2>
                <button class="more-modal-close" id="historyCloseMore" aria-label="Close more options">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul class="more-modal-list">
                <li><a href="profile.html">Profile</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="support.html">Customer Support</a></li>
                <li><button type="button" class="logout-btn" id="historyLogoutButton">Logout</button></li>
            </ul>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="booking.html" class="nav-item" aria-label="Explore listings">
            <i class="fas fa-home"></i>
            <span>Explore</span>
        </a>
        <a href="booking-history.html" class="nav-item active" aria-label="Past bookings">
            <i class="fas fa-car"></i>
            <span>Bookings</span>
        </a>
        <button class="nav-item more-toggle" id="historyMoreToggle" aria-label="More options">
            <i class="fas fa-ellipsis-h"></i>
            <span>More</span>
        </button>
    </nav>

    <script src="history.js"></script>
</body>
</html>
