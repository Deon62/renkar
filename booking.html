<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Ride | Renkar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Content -->
    <main class="booking-container">
        <div class="container">
            <div class="booking-header">
                <h1>Find your ride</h1>
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search car, brand, or location...">
                </div>
            </div>

            <!-- Car Listings Grid -->
            <div class="car-grid" id="carGrid">
                <!-- Cars will be loaded here via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Rental Confirmation Modal -->
    <div class="modal" id="rentalModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="modal-body">
                <div class="modal-car-image" id="modalCarImage"></div>
                <h2 id="modalCarName"></h2>
                <div class="car-details">
                    <p><i class="fas fa-map-marker-alt"></i> <span id="modalCarLocation"></span></p>
                    <p><i class="fas fa-tag"></i> <span id="modalCarPrice"></span></p>
                    <p><i class="fas fa-info-circle"></i> Free cancellation up to 24 hours before rental</p>
                </div>
                <button class="btn btn-primary btn-block" id="confirmRental">Confirm Rental</button>
            </div>
        </div>
    </div>

    <!-- More Options Modal -->
    <div class="more-modal" id="moreModal" aria-hidden="true">
        <div class="more-modal-overlay" id="moreModalOverlay"></div>
        <div class="more-modal-content" role="dialog" aria-modal="true" aria-labelledby="moreModalTitle">
            <div class="more-modal-header">
                <h2 id="moreModalTitle">More</h2>
                <button class="more-modal-close" id="closeMoreModal" aria-label="Close more options">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul class="more-modal-list">
                <li><a href="profile.html">Profile</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="support.html">Customer Support</a></li>
                <li><button type="button" class="logout-btn" id="logoutButton">Logout</button></li>
            </ul>
        </div>
    </div>

    <!-- Success Toast -->
    <div class="toast" id="successToast">
        <div class="toast-content">
            <i class="fas fa-check-circle"></i>
            <span>Car booked successfully!</span>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="booking.html" class="nav-item active" aria-label="Home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="booking-history.html" class="nav-item" aria-label="Booking history">
            <i class="fas fa-car"></i>
            <span>Bookings</span>
        </a>
        <button class="nav-item more-toggle" id="moreToggle" aria-label="More options">
            <i class="fas fa-ellipsis-h"></i>
            <span>More</span>
        </button>
    </nav>

    <script src="booking.js"></script>
</body>
</html>
