<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Profile | Renkar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="driver-profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="driver-profile">
        <header class="driver-hero">
            <button class="hero-toggle" id="statusToggle" aria-pressed="false">
                <span class="toggle-indicator"></span>
                <span class="toggle-label">Go Online</span>
            </button>
            <div class="hero-info">
                <img src="assets/deon.jpg" alt="Driver portrait" class="hero-avatar">
                <div>
                    <h1 id="driverName">Deon Orina</h1>
                    <p id="driverStatus">Currently Offline</p>
                </div>
            </div>
        </header>

        <section class="profile-card">
            <div class="profile-grid">
                <div class="profile-item">
                    <span class="label">Full Name</span>
                    <strong id="detailName">Deon Orina</strong>
                </div>
                <div class="profile-item">
                    <span class="label">Contact</span>
                    <strong id="detailContact">+254 712 345 678</strong>
                </div>
                <div class="profile-item">
                    <span class="label">Vehicle</span>
                    <strong id="detailCar">Toyota Prado TX • KDB 452Q</strong>
                </div>
                <div class="profile-item">
                    <span class="label">License Number</span>
                    <strong id="detailLicense">DL-34720891</strong>
                </div>
                <div class="profile-item">
                    <span class="label">Joined</span>
                    <strong id="detailJoin">May 2021</strong>
                </div>
                <div class="profile-item">
                    <span class="label">Trips Completed</span>
                    <strong id="detailTrips">486</strong>
                </div>
                <div class="profile-item full">
                    <span class="label">Verification</span>
                    <span class="chip verified"><i class="fas fa-shield-check"></i> Fully Verified</span>
                </div>
            </div>
            <div class="profile-actions">
                <button class="btn-secondary" id="viewDocs">View Documents</button>
                <button class="btn-primary" id="editProfile">Edit Profile</button>
            </div>
        </section>

        <section class="quick-links">
            <button class="quick-item" id="supportLink">
                <i class="fas fa-headset"></i>
                <span>Customer Support</span>
            </button>
            <button class="quick-item" id="notificationsLink">
                <i class="fas fa-bell"></i>
                <span>Notification Preferences</span>
            </button>
            <button class="quick-item logout" id="driverLogout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </section>
    </main>

    <nav class="driver-bottom-nav" role="navigation" aria-label="Driver navigation">
        <button class="driver-nav-item" id="tabOpenRequests" data-target="openRequestsPanel" aria-controls="openRequestsPanel" aria-selected="false">
            <i class="fas fa-car"></i>
            <span>Open Requests</span>
        </button>
        <button class="driver-nav-item" id="tabLastBookings" data-target="lastBookingsPanel" aria-controls="lastBookingsPanel" aria-selected="false">
            <i class="fas fa-clock"></i>
            <span>Last Bookings</span>
        </button>
        <button class="driver-nav-item" id="tabMore" aria-label="More options">
            <i class="fas fa-ellipsis-h"></i>
            <span>More</span>
        </button>
    </nav>

    <div class="driver-more-modal" id="driverMoreModal" aria-hidden="true">
        <div class="driver-modal-overlay" id="driverModalOverlay"></div>
        <div class="driver-modal-content" role="dialog" aria-modal="true" aria-labelledby="driverMoreTitle">
            <span class="modal-handle"></span>
            <div class="driver-modal-header">
                <h2 id="driverMoreTitle">More</h2>
                <button class="driver-modal-close" id="driverCloseMore" aria-label="Close more options">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul class="driver-modal-list">
                <li>
                    <button type="button" class="modal-link" id="profileButton">
                        <span><i class="fas fa-user"></i> Profile</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </li>
                <li>
                    <button type="button" class="modal-link" id="financesButton">
                        <span><i class="fas fa-wallet"></i> Finances</span>
                        <span class="earnings">KES 42,500</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="modal-link modal-logout" id="driverLogoutAlt">
                        <span><i class="fas fa-sign-out-alt"></i> Logout</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <script src="driver-profile.js"></script>
</body>
</html>
