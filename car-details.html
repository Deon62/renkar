<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details | Renkar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="car-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="car-page">
        <header class="car-header">
            <button class="header-btn" id="backBtn" aria-label="Go back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-info">
                <h1 id="carName">BMW 3 Series (2023)</h1>
                <p id="vendorName">Executive Line</p>
            </div>
            <button class="header-btn" id="favoriteBtn" aria-label="Add to favorites">
                <i class="far fa-heart"></i>
            </button>
        </header>

        <section class="carousel-wrapper">
            <div class="carousel" id="carCarousel">
                <div class="carousel-track" id="carouselTrack"></div>
            </div>
            <div class="carousel-indicators" id="carouselDots"></div>
        </section>

        <section class="quick-facts" aria-label="Car quick facts">
            <div class="fact">
                <i class="fas fa-users"></i>
                <span>Seats</span>
                <strong id="carSeats">5</strong>
            </div>
            <div class="fact">
                <i class="fas fa-gas-pump"></i>
                <span>Fuel</span>
                <strong id="carFuel">Petrol</strong>
            </div>
            <div class="fact">
                <i class="fas fa-tachometer-alt"></i>
                <span>Mileage</span>
                <strong id="carMileage">32,000 km</strong>
            </div>
            <div class="fact">
                <i class="fas fa-palette"></i>
                <span>Color</span>
                <strong id="carColor">Black</strong>
            </div>
            <div class="fact">
                <i class="fas fa-cogs"></i>
                <span>Engine</span>
                <strong id="carEngine">2000cc</strong>
            </div>
        </section>

        <section class="booking-card">
            <h2>Schedule your ride</h2>
            <form class="booking-form" id="bookingForm">
                <label class="input-field">
                    <span>Pickup Date</span>
                    <input type="date" id="pickupDate" placeholder="Select pickup date" required>
                </label>
                <label class="input-field">
                    <span>Return Date</span>
                    <input type="date" id="returnDate" placeholder="Select return date" required>
                </label>
                <label class="input-field">
                    <span>Pickup Location</span>
                    <select id="pickupLocation" required>
                        <option value="">Select pickup area</option>
                        <option value="wilson">Wilson Airport</option>
                        <option value="westlands">Westlands</option>
                        <option value="cbd">Nairobi CBD</option>
                        <option value="jkia">JKIA</option>
                    </select>
                </label>
                <label class="input-field">
                    <span>Return Location</span>
                    <select id="returnLocation" required>
                        <option value="">Select return area</option>
                        <option value="wilson">Wilson Airport</option>
                        <option value="westlands">Westlands</option>
                        <option value="cbd">Nairobi CBD</option>
                        <option value="jkia">JKIA</option>
                    </select>
                </label>
            </form>
        </section>

        <section class="pricing" aria-label="Pricing summary">
            <div class="pricing-row">
                <span>Estimated Total</span>
                <strong id="estimatedTotal">KES 5,500</strong>
            </div>
            <p class="pricing-note">Price may vary based on duration and distance.</p>
        </section>
    </main>

    <button class="checkout-btn" id="proceedToRent">Proceed to Checkout</button>

    <script src="car-details.js"></script>
</body>
</html>
