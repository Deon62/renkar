<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A1D37">
    <title>You're Offline | Renkar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 2rem;
            background: #0A1D37;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { 
            margin-bottom: 1rem; 
            font-size: 2rem;
            font-weight: 700;
        }
        p { 
            margin-bottom: 2rem; 
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .logo { 
            width: 120px; 
            height: 120px;
            margin-bottom: 2rem; 
            border-radius: 50%;
        }
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <img src="assets/logo/opa.png" alt="Renkar Logo" class="logo">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="window.location.href='/'" style="
        padding: 12px 24px;
        background: white;
        color: #0A1D37;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
    ">Go to Home</button>
</body>
</html>
